name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
        run: |
          # Fix region format for endpoint
          ENDPOINT="oss-${OSS_REGION}.aliyuncs.com"
          
          # Generate date
          DATE=$(date -u -R)
          
          # Upload each file using ossutil if available, otherwise use curl with proper escaping
          while IFS= read -r -d '' file; do
            FILENAME="${file#./build/}"
            echo "Uploading $FILENAME..."
            
            # Generate signature
            STRING_TO_SIGN="PUT\n\napplication/octet-stream\n${DATE}\n/${OSS_BUCKET}/${FILENAME}"
            SIGNATURE=$(echo -en "$STRING_TO_SIGN" | openssl dgst -sha1 -hmac "$OSS_ACCESS_KEY_SECRET" | sed 's/^.*= //')
            
            curl -X PUT -T "$file" \
              -H "Date: $DATE" \
              -H "Content-Type: application/octet-stream" \
              -H "Authorization: OSS $OSS_ACCESS_KEY_ID:$SIGNATURE" \
              "https://${OSS_BUCKET}.${ENDPOINT}/${FILENAME}" -f -s
              
            if [ $? -eq 0 ]; then
              echo "Uploaded: $FILENAME"
            else
              echo "Failed: $FILENAME"
            fi
          done < <(find ./build -type f -print0)
          echo "Done!"
