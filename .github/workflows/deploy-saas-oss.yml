name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
        run: |
          # Fix region format for endpoint
          ENDPOINT="oss-${OSS_REGION}.aliyuncs.com"
          
          # Generate date
          DATE=$(date -u -R)
          
          # Upload each file
          while IFS= read -r -d '' file; do
            # URL encode the filename
            FILENAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${file#./build/}'))")
            echo "Uploading $FILENAME..."
            
            # Generate signature (use URL encoded path)
            STRING_TO_SIGN="PUT\n\napplication/octet-stream\n${DATE}\n/${OSS_BUCKET}/${FILENAME}"
            SIGNATURE=$(echo -en "$STRING_TO_SIGN" | openssl dgst -sha1 -hmac "$OSS_ACCESS_KEY_SECRET" | sed 's/^.*= //')
            
            # Use python to upload to handle special characters
            python3 << PYEOF
import os
import subprocess
import urllib.parse

file_path = "$file"
filename = "$FILENAME"

# Get signature from shell
result = subprocess.run(
    ['bash', '-c', 'echo -en "PUT\\n\\napplication/octet-stream\\n${DATE}\\n/${OSS_BUCKET}/${FILENAME}" | openssl dgst -sha1 -hmac "$OSS_ACCESS_KEY_SECRET" | sed "s/^.*= //"'],
    capture_output=True, text=True
)
signature = result.stdout.strip()

# Upload via curl
url = f"https://$OSS_BUCKET.$ENDPOINT/{filename}"
cmd = [
    'curl', '-X', 'PUT', '-T', file_path,
    '-H', f'Date: $DATE',
    '-H', 'Content-Type: application/octet-stream',
    '-H', f'Authorization: OSS $OSS_ACCESS_KEY_ID:{signature}',
    url, '-f', '-s'
]
result = subprocess.run(cmd)
if result.returncode == 0:
    print(f"Uploaded: {filename}")
else:
    print(f"Failed: {filename}, code: {result.returncode}")
PYEOF
          done < <(find ./build -type f -print0)
          echo "Done!"
