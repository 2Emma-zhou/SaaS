name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Upload to OSS
        uses: manyunyu/aliyun-oss-actions-serverless@main
        with:
          access_key_id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access_key_secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          bucket: tier0saas1
          region: cn-hangzhou
          source_dir: ./build
          target_dir: /
