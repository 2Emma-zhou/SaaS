name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install OSS2
        run: pip install oss2
        
      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
        run: |
          python3 << 'EOF'
          import oss2
          import os
          
          auth = oss2.Auth('${{ secrets.OSS_ACCESS_KEY_ID }}', '${{ secrets.OSS_ACCESS_KEY_SECRET }}')
          endpoint = '${{ secrets.OSS_REGION }}.aliyuncs.com'
          bucket = oss2.Bucket(auth, 'https://' + endpoint, '${{ secrets.OSS_BUCKET }}')
          
          for root, dirs, files in os.walk('./build'):
              for file in files:
                  file_path = os.path.join(root, file)
                  oss_path = file_path.replace('./build/', '').replace('\\', '/').lstrip('/')
                  bucket.put_object_from_file(oss_path, file_path)
          print('All files uploaded!')
          EOF
