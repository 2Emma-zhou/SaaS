name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Install Aliyun CLI
        run: |
          pip install aliyun-python-sdk-core
          pip install aliyun-python-sdk-oss
      
      - name: Configure OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          pip install oss2
          python -c "
import oss2
auth = oss2.Auth('${{ secrets.OSS_ACCESS_KEY_ID }}', '${{ secrets.OSS_ACCESS_KEY_SECRET }}')
bucket = oss2.Bucket(auth, 'http://oss-cn-hangzhou.aliyuncs.com', 'tier0saas1')
bucket.put_bucket_acl('public-read')
"
      
      - name: Upload to OSS
        run: |
          python -c "
import oss2
import os
import glob

auth = oss2.Auth('${{ secrets.OSS_ACCESS_KEY_ID }}', '${{ secrets.OSS_ACCESS_KEY_SECRET }}')
bucket = oss2.Bucket(auth, 'http://oss-cn-hangzhou.aliyuncs.com', 'tier0saas1')

for root, dirs, files in os.walk('./build'):
    for file in files:
        local_path = os.path.join(root, file)
        oss_path = local_path.replace('./build/', '')
        bucket.put_object_from_file(oss_path, local_path)
        print(f'Uploaded: {oss_path}')
"
