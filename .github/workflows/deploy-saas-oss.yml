name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Configure Aliyun OSS
        uses: manyunyu/aliyun-oss-actions@v1
        with:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_OSS_BUCKET: tier0saas1
          ALIBABA_CLOUD_OSS_REGION: ${{ secrets.OSS_REGION }}
          
      - name: Upload to OSS
        run: |
          aliyun oss cp -r ./build/ oss://tier0saas1/ --force

