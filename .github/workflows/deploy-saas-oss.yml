name: Deploy to OSS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
        run: |
          # Generate date and signature
          DATE=$(date -u -R)
          SIGNATURE=$(echo -en "PUT\n\napplication/octet-stream\n${DATE}\n/$OSS_BUCKET/" | openssl dgst -sha1 -hmac "$OSS_ACCESS_KEY_SECRET" | sed 's/^.*= //')
          
          # Upload each file
          for file in $(find ./build -type f); do
            FILENAME="${file#./build/}"
            echo "Uploading $FILENAME..."
            curl -X PUT -T "$file" \
              -H "Date: $DATE" \
              -H "Content-Type: application/octet-stream" \
              -H "Authorization: OSS $OSS_ACCESS_KEY_ID:$SIGNATURE" \
              "https://$OSS_BUCKET.oss-$OSS_REGION.aliyuncs.com/$FILENAME"
          done
          echo "Done!"
