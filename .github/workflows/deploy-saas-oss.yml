name: Deploy to OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: tier0saas
          OSS_REGION: oss-cn-hangzhou
        run: |
          python3 <<'EOF'
          import os
          import subprocess
          import urllib.parse
          from datetime import datetime

          access_key_id = os.environ['OSS_ACCESS_KEY_ID']
          access_key_secret = os.environ['OSS_ACCESS_KEY_SECRET']
          bucket_name = os.environ['OSS_BUCKET']
          region = os.environ['OSS_REGION']

          endpoint = f"{region}.aliyuncs.com"
          date_str = datetime.utcnow().strftime('%a, %d %b %Y %H:%M:%S GMT')

          print(f"Bucket: {bucket_name}")
          print(f"Endpoint: {endpoint}")

          for root, dirs, files in os.walk('./build'):
              for file in files:
                  file_path = os.path.join(root, file)
                  oss_path = file_path.replace('./build/', '').replace('\\', '/').lstrip('/')
                  oss_path_encoded = urllib.parse.quote(oss_path)

                  string_to_sign = f"PUT\\n\\napplication/octet-stream\\n{date_str}\\n/{bucket_name}/{oss_path_encoded}"
                  result = subprocess.run(
                      ['openssl', 'dgst', '-sha1', '-hmac', access_key_secret],
                      input=string_to_sign.encode(),
                      capture_output=True,
                      check=True
                  )
                  signature = result.stdout.decode().strip().split(' ')[-1]

                  url = f"https://{bucket_name}.{endpoint}/{oss_path_encoded}"
                  cmd = [
                      'curl', '-X', 'PUT', '-T', file_path,
                      '-H', f'Date: {date_str}',
                      '-H', 'Content-Type: application/octet-stream',
                      '-H', f'Authorization: OSS {access_key_id}:{signature}',
                      url, '-f', '-sS'
                  ]

                  result = subprocess.run(cmd)
                  if result.returncode == 0:
                      print(f"Uploaded: {oss_path}")
                  else:
                      print(f"Failed: {oss_path}, code: {result.returncode}")
                      raise SystemExit(result.returncode)

          print("Done!")
          EOF
